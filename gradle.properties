# মেমোরি বাড়ানো হচ্ছে (BlackBox engine + native build-এর জন্য ৪ জিবি)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# আগের সেটিংসগুলো ঠিক রাখুন
android.useAndroidX=true
android.enableJetifier=true
# AGP 8.13 officially supports up to API 36; compileSdk 37 is allowed on purpose
android.suppressUnsupportedCompileSdk=36,37,37.0
# false: :winlator uses R.attr.colorAccent / colorError / colorPrimarySurface, which live in appcompat/material
android.nonTransitiveRClass=false
android.javaCompile.suppressSourceTargetDeprecationWarning=true
# NOTE: library modules never get constant R ids, so :winlator must not use "case R.id.xxx"
# (those switches were converted to if/else). This flag only affects application modules.
android.nonFinalResIds=false

# Seal (:seal, built-in Downloader), part 7. Optional:
# apkAbis=arm64-v8a,armeabi-v7a  keep only these ABIs in the APK (app/build.gradle.kts, ndk.abiFilters). The yt-dlp engine (Python + FFmpeg + aria2c) ships 4 ABIs; dropping x86 / x86_64
#                                is the main way to make the APK smaller (size not measured here). Default: not set, nothing is dropped.

# RetroArch (:retroarch), see retroarch/build.gradle.kts and retroarch/README.md (steps 5 to 10; the CI workflows set retroarchCcache=true by themselves). All optional:
# retroarchNative=false          skip RetroArch's native build and the 330 MB source clone (the module then has Java + manifest but no native library; do not use the RetroArch app hooks then)
# retroarchAbis=arm64-v8a,x86_64 ABIs of libretroarch-activity.so (default arm64-v8a)
# retroarchCcache=true           ndk-build uses ccache (NDK_CCACHE=ccache; only useful if ccache is installed, CI does it)
# retroarchGles=3                GLESv3 instead of upstream's default GLESv2
# retroarchCFlags=-Wno-error=implicit-function-declaration   extra C flags, only if a real build needs them

# Mika (:mika-core + :mika, the "Rizwan" assistant), see settings.gradle.kts and mika/README.md (part 5). Optional:
# includeMika=false              leave both modules and the :app dependency on them out of the build (no clone of Mika, no python3 needed). Since part 6 AppBase extends MikaApp, so the property alone does not compile: the "without" workflow (UltimateBuild_WithoutMe.yml, input include_mika, part 9) deletes the modules and swaps AppBase.kt and MikaLauncher.kt for mika/tools/stub/*.stub; do the same by hand for a local build without Mika.

# targetSdk of :app (part 8 of the Mika plan). Default 37. appTargetSdk=28 goes back to the old value: needed again if Winlator (runs box64 / wine from the app data folder) or
# RetroArch's downloaded cores must work, because Android blocks executing files from the data folder for apps that target 29 or more. See docs/CHANGES-mika-part8.md.
# appTargetSdk=28
