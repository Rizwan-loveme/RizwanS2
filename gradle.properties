# মেমোরি বাড়ানো হচ্ছে (BlackBox engine + native build-এর জন্য ৪ জিবি)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# আগের সেটিংসগুলো ঠিক রাখুন
android.useAndroidX=true
android.enableJetifier=true
# AGP 8.13 officially supports up to API 36; compileSdk 37 is allowed on purpose
android.suppressUnsupportedCompileSdk=36,37,37.0
# false: :winlator uses R.attr.colorAccent / colorError / colorPrimarySurface, which live in appcompat/material
android.nonTransitiveRClass=false
android.javaCompile.suppressSourceTargetDeprecationWarning=true
# NOTE: library modules never get constant R ids, so :winlator must not use "case R.id.xxx"
# (those switches were converted to if/else). This flag only affects application modules.
android.nonFinalResIds=false
